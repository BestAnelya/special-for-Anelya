<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Почему ты особенная? ♡</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #ffe3ed;
      background:
        radial-gradient(ellipse at 20% 80%, #542746 0%, transparent 42%),
        radial-gradient(ellipse at 80% 20%, #30234d 0%, transparent 40%),
        linear-gradient(145deg, #090d1b, #171329 55%, #351b36);
    }
    .stars, .hearts {
      position: fixed; inset: 0; pointer-events: none; overflow: hidden;
    }
    .star {
      position: absolute; width: 2px; height: 2px; border-radius: 50%;
      background: #ffd6e5; opacity: .7;
      animation: twinkle 3s ease-in-out infinite alternate;
    }
    @keyframes twinkle { from {opacity:.2; transform:scale(.7)} to {opacity:1; transform:scale(1.5)} }
    .card {
      width: min(92vw, 620px);
      text-align: center;
      padding: 42px 26px;
      position: relative;
      z-index: 1;
      border: 1px solid rgba(255, 190, 220, .18);
      border-radius: 28px;
      background: rgba(15, 13, 29, .48);
      backdrop-filter: blur(12px);
      box-shadow: 0 25px 80px rgba(0,0,0,.25);
    }
    .tiny { color: #f6a8c5; letter-spacing: 3px; font-size: 13px; text-transform: uppercase; }
    h1 {
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: clamp(36px, 8vw, 62px);
      line-height: 1.1;
      margin: 18px 0;
      color: #ffb7d0;
    }
    .intro { color: #e7cbd8; font-size: 17px; line-height: 1.7; margin: 0 auto 28px; max-width: 440px; }
    button {
      border: 0; border-radius: 999px; padding: 16px 30px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      color: #32172a; background: linear-gradient(135deg, #ffc4d8, #f58eb4);
      box-shadow: 0 8px 30px rgba(245, 142, 180, .2);
      transition: transform .2s, box-shadow .2s;
    }
    button:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(245, 142, 180, .35); }
    button:active { transform: scale(.98); }
    #reason {
      min-height: 86px; display: grid; place-items: center;
      margin: 26px auto 0; max-width: 470px;
      font-family: Georgia, serif; font-size: clamp(20px, 4vw, 27px);
      line-height: 1.5; color: #fff0f5;
      opacity: 0; transform: translateY(8px);
      transition: opacity .35s, transform .35s;
    }
    #reason.show { opacity: 1; transform: translateY(0); }
    .footer { margin-top: 26px; color: #cda7bd; font-size: 14px; }
    .floating-heart {
      position: absolute; bottom: -40px; color: #ff9fbe;
      animation: floatUp 6s linear forwards; opacity: .8;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0); opacity: 0; }
      15% { opacity: .8; }
      100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="hearts" id="hearts"></div>

  <main class="card">
    <div class="tiny">маленький сайт для тебя ♡</div>
    <h1>Почему ты<br>особенная?</h1>
    <p class="intro">Я хотел напомнить тебе кое-что хорошее.<br>
      Нажми на кнопку — и узнаешь одну из причин.</p>

    <button id="next">♡ Нажми сюда</button>
    <div id="reason" aria-live="polite"></div>
    <div class="footer">спасибо, что ты есть в моей жизни ♡</div>
  </main>

  <script>
    // Можешь заменить эти фразы на ваши личные воспоминания
    const reasons = [
      "С тобой даже обычный день становится лучше.",
      "Ты умеешь поднять мне настроение, даже когда всё не очень.",
      "Мне нравится, что с тобой можно быть самим собой.",
      "Ты невероятно милая, даже когда сама этого не замечаешь.",
      "Я ценю наши разговоры — и серьёзные, и совершенно глупые.",
      "Ты один из тех людей, с которыми хочется делиться хорошими новостями.",
      "Мне повезло, что ты есть в моей жизни.",
      "Ты особенная для меня. Просто хотела, чтобы ты это знала. ♡"
    ];

    let remaining = [...reasons];
    const button = document.getElementById("next");
    const reason = document.getElementById("reason");

    button.addEventListener("click", () => {
      if (remaining.length === 0) remaining = [...reasons];
      const index = Math.floor(Math.random() * remaining.length);
      const message = remaining.splice(index, 1)[0];

      reason.classList.remove("show");
      setTimeout(() => {
        reason.textContent = message;
        reason.classList.add("show");
      }, 120);

      button.textContent = remaining.length ? "♡ Ещё одну причину" : "♡ Начать сначала";
      for (let i = 0; i < 5; i++) makeHeart();
    });

    // Звёздочки на фоне
    const stars = document.getElementById("stars");
    for (let i = 0; i < 65; i++) {
      const star = document.createElement("span");
      star.className = "star";
      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";
      star.style.animationDelay = Math.random() * 3 + "s";
      stars.appendChild(star);
    }

    function makeHeart() {
      const heart = document.createElement("span");
      heart.className = "floating-heart";
      heart.textContent = Math.random() > .5 ? "♡" : "♥";
      heart.style.left = Math.random() * 100 + "%";
      heart.style.fontSize = (16 + Math.random() * 22) + "px";
      heart.style.animationDuration = (4 + Math.random() * 3) + "s";
      document.getElementById("hearts").appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }
  </script>
</body>
</html>
